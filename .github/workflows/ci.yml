# CI for sky130-modexp.
#
# Scope is deliberate and documented, not accidental: this workflow runs the
# **tool-light** legs only -- the multi-WIDTH Icarus cross-check, the
# evidence-record linter, and the klt signoff manifest check. None needs a
# PDK.
#
# The PDK-heavy legs (`klt synthesize`, `klt place-and-route`, `klt drc`)
# are NOT run here: they need a fetched sky130A PDK and, for P&R, `openroad`.
# Those are run locally against the pinned environment from
# `scripts/setup-env.sh` and committed as append-only records under
# `verification/records/`. The split is stated in
# `verification/README.md` -> "What CI runs vs. what stays local" and in
# `docs/environment.md`. Do not silently drop a leg: if you move one of the
# heavy legs into CI, update both documents in the same change.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  records:
    name: evidence records (lint + append-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the append-only check diffs against the merge-base
          # with origin/main, which a shallow clone cannot resolve.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ensure origin/main is available for the append-only base ref
        run: git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main

      - name: Syntax-check the verification scripts and setup script
        run: |
          python3 -m compileall -q verification/cross_check.py \
                                   verification/cross_check_tb.py \
                                   verification/check_records.py \
                                   verification/test_check_records.py \
                                   verification/test_modexp.py \
                                   verification/gate-level/spice_to_verilog.py \
                                   verification/gate-level/test_spice_to_verilog.py \
                                   verification/gate-level/gate_level_cross_check.py
          bash -n verification/gate-level/run-gate-level-sim.sh
          bash -n scripts/setup-env.sh

      - name: Record linter + its self-test (npm run lint)
        run: npm run lint

      - name: Record linter, strict append-only against origin/main
        run: python3 verification/check_records.py --require-append-only --base-ref origin/main

  cross-check:
    name: multi-WIDTH cross-check (cocotb + Icarus)
    runs-on: ubuntu-latest
    # Normal runs complete in well under 2 minutes (see recent workflow
    # history); 30 minutes gives generous headroom while still failing fast
    # if a step hangs (e.g. an apt-get fetch), instead of consuming the
    # GitHub Actions default of 360 minutes (#73).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
          iverilog -V | head -1

      - name: Install cocotb (pinned -- see docs/environment.md)
        run: python3 -m pip install --disable-pip-version-check "cocotb==2.0.1"

      - name: Cross-check WIDTH = 4, 6, 8, 16 (npm run test)
        run: npm run test

      - name: Re-run and assert byte-identical vectors (seed is pinned)
        run: |
          set -euo pipefail
          python3 verification/cross_check.py --widths 4 6 --cases 40 \
            --transcript-dir /tmp/determinism-a > /dev/null
          python3 verification/cross_check.py --widths 4 6 --cases 40 \
            --transcript-dir /tmp/determinism-b > /dev/null
          for w in 4 6; do
            cmp "/tmp/determinism-a/width-$w.jsonl" "/tmp/determinism-b/width-$w.jsonl"
            echo "WIDTH=$w: transcripts byte-identical across runs"
          done

  signoff:
    name: T1 tier report (klt signoff manifest check)
    runs-on: ubuntu-latest
    # The graded gap-to-T1 verdict of record (issue #130): re-renders
    # `klt signoff --manifest verification/signoff/block-manifest.json`
    # against the committed tier doc and byte-compares with the committed
    # tier-report.json. A manifest citing an artifact that has since changed
    # (its content_hash pin no longer matches the envelope) flips rows to
    # stale_evidence, the diff goes non-empty, and CI fails instead of
    # letting the committed verdict rot. Tool-light by construction -- the
    # report leg only reads committed JSON envelopes, no PDK, no simulator
    # -- so it installs its own klt pin (newer than the PDK-heavy legs'
    # pin, which predates the digital-flow evidence kinds and item 11; see
    # docs/environment.md -> "Pinned versions").
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install klt at the signoff-report pin
        run: |
          python3 -m pip install --disable-pip-version-check \
            "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@dac2b5daceb69a2068d9d2ee190d7afe37b29af7"

      - name: Regenerate and compare the tier report
        run: ./verification/signoff/run-signoff.sh --check

  guard-hooks:
    name: Loom guard-hook regression suites
    runs-on: ubuntu-latest
    # Regression protection for #107: a `chore: resync installed Loom
    # surfaces` commit copies the upstream Loom `.loom/hooks/*.sh` wholesale
    # over this repo's installed copies with no diff review, which has
    # already silently reverted three merged, tested fixes to
    # `guard-destructive-generic.sh` (#71/#72, #98, #100) because nothing ran
    # these suites in CI. Each `.loom/hooks/tests/test-*.sh` file is a
    # self-contained regression suite (its own `mktemp -d` sandbox, its own
    # scratch git repo/worktree) that exercises the corresponding installed
    # hook directly -- running them here means a future resync that reverts
    # a fix fails the build instead of waiting for a human/Curator to notice.
    steps:
      - uses: actions/checkout@v4

      - name: Run .loom/hooks/tests/ suites
        run: |
          # Deliberately NOT `set -e`: GitHub Actions' default `run:` shell
          # is `bash -eo pipefail`, so a suite that exits non-zero would make
          # the `out=$(bash "$f" 2>&1)` assignment abort this whole step
          # immediately, before the pass/fail classification below ever runs
          # -- silently turning every suite AFTER the first failing one into
          # a false "did not run" pass, which is exactly the blind spot this
          # job exists to close. `set +e` overrides the runner default so
          # every suite runs and each rc is classified explicitly.
          set +e -u -o pipefail
          overall_fail=0
          for f in .loom/hooks/tests/*.sh; do
            echo "::group::$f"
            out=$(bash "$f" 2>&1)
            rc=$?
            printf '%s\n' "$out"
            echo "::endgroup::"

            # NOTE: the resolve-var suite used to be carved out here, with
            # its cases (i)/(j) tolerated as a known pre-existing failure
            # (#96). That carve-out is gone: #96 established that the ALLOW
            # verdict comes from wt_write_mktemp_same_command_safe(), a
            # deliberate safety feature that reached the vendored hook AFTER
            # those assertions were written, so the suite's own assertions
            # were updated to match and it now passes outright. Every suite
            # is judged on its exit status alone again -- do not reintroduce
            # a per-suite tolerance without a tracked issue, since a
            # carve-out also suppresses that suite's rc entirely.
            if [[ "$rc" -ne 0 ]]; then
              echo "FAILED: $f (exit $rc)"
              overall_fail=1
            fi
          done
          exit "$overall_fail"

  merge-pr-suites:
    name: Loom merge-pr.sh regression suites
    runs-on: ubuntu-latest
    # Regression protection for #126: nothing in CI ran .loom/scripts/tests/
    # at all, which is how resync commit 9118550 could revert both the #104
    # `|| true` fix in merge-pr.sh's _check_champion_hold_state_staleness()
    # AND its own T10 regression test in the same commit and still get a
    # fully green CI run (#124 / PR #125 restored the fix; this job is the
    # structural fix that stops it from being silently revertible again).
    #
    # Scoped deliberately narrow: only the `test-merge-pr-*.sh` suites, run
    # directly by globbing the directory -- NOT via run-ci-suites.sh and the
    # ci-wired.txt manifest, which references suites/paths (defaults/,
    # tests/install/, tests/hermit/) that don't exist in this consumer repo
    # and fails its own precondition check here. All test-merge-pr-*.sh
    # suites are present in this repo and already listed in ci-wired.txt
    # (see .loom/scripts/tests/ci-wired.txt lines ~143-164); wiring the rest
    # of that manifest is tracked separately.
    steps:
      - uses: actions/checkout@v4

      - name: Run .loom/scripts/tests/test-merge-pr-*.sh suites
        run: |
          # See the "Deliberately NOT set -e" rationale in the guard-hooks
          # job above -- same reasoning applies here.
          set +e -u -o pipefail
          overall_fail=0
          for f in .loom/scripts/tests/test-merge-pr-*.sh; do
            echo "::group::$f"
            out=$(bash "$f" 2>&1)
            rc=$?
            printf '%s\n' "$out"
            echo "::endgroup::"

            if [[ "$rc" -ne 0 ]]; then
              echo "FAILED: $f (exit $rc)"
              overall_fail=1
            fi
          done
          exit "$overall_fail"
