# CI for sky130-modexp.
#
# Scope is deliberate and documented, not accidental: this workflow runs the
# **tool-light** legs only -- the multi-WIDTH Icarus cross-check, the
# evidence-record linter, and the klt signoff manifest check. None needs a
# PDK.
#
# The PDK-heavy legs (`klt synthesize`, `klt place-and-route`, `klt drc`)
# are NOT run here: they need a fetched sky130A PDK and, for P&R, `openroad`.
# Those are run locally against the pinned environment from
# `scripts/setup-env.sh` and committed as append-only records under
# `verification/records/`. The split is stated in
# `verification/README.md` -> "What CI runs vs. what stays local" and in
# `docs/environment.md`. Do not silently drop a leg: if you move one of the
# heavy legs into CI, update both documents in the same change.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  records:
    name: evidence records (lint + append-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the append-only check diffs against the merge-base
          # with origin/main, which a shallow clone cannot resolve.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ensure origin/main is available for the append-only base ref
        run: git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main

      - name: Syntax-check the verification scripts and setup script
        run: |
          python3 -m compileall -q verification/cross_check.py \
                                   verification/cross_check_tb.py \
                                   verification/check_records.py \
                                   verification/test_check_records.py \
                                   verification/check_pins.py \
                                   verification/test_check_pins.py \
                                   verification/test_modexp.py \
                                   verification/gate-level/spice_to_verilog.py \
                                   verification/gate-level/test_spice_to_verilog.py \
                                   verification/gate-level/gate_level_cross_check.py
          bash -n verification/gate-level/run-gate-level-sim.sh
          bash -n scripts/setup-env.sh
          bash -n scripts/run-loom-suites.sh
          bash -n scripts/tests/test-run-loom-suites.sh

      - name: Loom suite-runner self-test (scripts/tests/test-run-loom-suites.sh)
        # scripts/run-loom-suites.sh decides whether the guard-hooks and
        # merge-pr-suites jobs below actually ran anything, so it is held to
        # the same standard as verification/check_*.py: a self-test, run in
        # CI (#338). It is hermetic -- synthetic suites and manifests in a
        # mktemp -d sandbox, no vendored Loom suite executed.
        run: ./scripts/tests/test-run-loom-suites.sh

      - name: Record linter, pin-sync checker, and their self-tests (npm run lint)
        run: npm run lint

      - name: Record linter, strict append-only against origin/main
        run: python3 verification/check_records.py --require-append-only --base-ref origin/main

  cross-check:
    name: multi-WIDTH cross-check (cocotb + Icarus)
    runs-on: ubuntu-latest
    # Normal runs complete in well under 2 minutes (see recent workflow
    # history); 30 minutes gives generous headroom while still failing fast
    # if a step hangs (e.g. an apt-get fetch), instead of consuming the
    # GitHub Actions default of 360 minutes (#73).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
          iverilog -V | head -1

      - name: Install cocotb (pinned -- see docs/environment.md)
        run: python3 -m pip install --disable-pip-version-check "cocotb==2.0.1"

      - name: Cross-check WIDTH = 4, 6, 8, 16 (npm run test)
        run: npm run test

      - name: Re-run and assert byte-identical vectors (seed is pinned)
        run: |
          set -euo pipefail
          python3 verification/cross_check.py --widths 4 6 --cases 40 \
            --transcript-dir /tmp/determinism-a > /dev/null
          python3 verification/cross_check.py --widths 4 6 --cases 40 \
            --transcript-dir /tmp/determinism-b > /dev/null
          for w in 4 6; do
            cmp "/tmp/determinism-a/width-$w.jsonl" "/tmp/determinism-b/width-$w.jsonl"
            echo "WIDTH=$w: transcripts byte-identical across runs"
          done

  signoff:
    name: T1 tier report (klt signoff manifest check)
    runs-on: ubuntu-latest
    # The graded gap-to-T1 verdict of record (issue #130): re-renders
    # `klt signoff --manifest verification/signoff/block-manifest.json`
    # against the committed tier doc and byte-compares with the committed
    # tier-report.json. A manifest citing an artifact that has since changed
    # (its content_hash pin no longer matches the envelope) flips rows to
    # stale_evidence, the diff goes non-empty, and CI fails instead of
    # letting the committed verdict rot. Tool-light by construction -- the
    # report leg only reads committed JSON envelopes, no PDK, no simulator
    # -- so it installs klt itself, at the same PyPI release as the PDK-heavy
    # legs (see docs/environment.md -> "Pinned versions").
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install klt at the signoff-report pin
        run: |
          python3 -m pip install --disable-pip-version-check "klayout-tools==0.8.0"
          klt --version

      - name: Install Icarus Verilog and cocotb (item 9 cold start)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
          python3 -m pip install --disable-pip-version-check "cocotb==2.0.1"

      - name: Regenerate and compare the tier report
        run: ./verification/signoff/run-signoff.sh --check

      # Re-attest T1 items 1, 9, 10 (issue #266): runs each inventory's
      # mechanical checks and diffs against the committed envelope, so a
      # drifted inventoried file or a failing check outcome fails CI.
      - name: Re-attest T1 item 1 (design sources + netlist freshness)
        run: klt signoff --attest 1 --inventory verification/signoff/inventory-item1.json --check verification/signoff/evidence/item-1-design-sources.json

      - name: Re-attest T1 item 9 (testbenches + cold start + pins)
        run: klt signoff --attest 9 --inventory verification/signoff/inventory-item9.json --check verification/signoff/evidence/item-9-testbenches.json

      - name: Re-attest T1 item 10 (repo hygiene + audit commands)
        run: klt signoff --attest 10 --inventory verification/signoff/inventory-item10.json --check verification/signoff/evidence/item-10-repo-hygiene.json

      - name: Check the item 8 characterization envelope and manifest pin
        run: python3 verification/signoff/gen_characterization_envelope.py --check

  guard-hooks:
    name: Loom guard-hook regression suites
    runs-on: ubuntu-latest
    # Regression protection for #107: a `chore: resync installed Loom
    # surfaces` commit copies the upstream Loom `.loom/hooks/*.sh` wholesale
    # over this repo's installed copies with no diff review, which has
    # already silently reverted three merged, tested fixes to
    # `guard-destructive-generic.sh` (#71/#72, #98, #100) because nothing ran
    # these suites in CI. Each `.loom/hooks/tests/test-*.sh` file is a
    # self-contained regression suite (its own `mktemp -d` sandbox, its own
    # scratch git repo/worktree) that exercises the corresponding installed
    # hook directly -- running them here means a future resync that reverts
    # a fix fails the build instead of waiting for a human/Curator to notice.
    steps:
      - uses: actions/checkout@v4

      - name: Run .loom/hooks/tests/ suites
        # Runner: scripts/run-loom-suites.sh -- repo-owned (it must stay
        # outside .loom/, or a resync would overwrite it), with its own
        # self-test at scripts/tests/test-run-loom-suites.sh run by the
        # `records` job. It holds the suite-classification algorithm, the
        # two-manifest skip protocol and the "deliberately NOT set -e"
        # rationale, stated once there instead of once per job (#338).
        #
        # Some upstream hook suites cannot pass on this consumer repo's
        # runners (#185): test-guard-mcp-tools.sh is daemon-backed and already
        # tracked in upstream's ci-excluded.txt -- under defaults/hooks/tests/,
        # which is why this job passes --manifest-prefix -- and two more are
        # consumer-layout-skewed and tracked in the repo-owned supplement
        # .github/ci-suites-consumer-skips.txt. Both manifests are consulted by
        # basename so the skip set self-maintains across resyncs, and every
        # skip prints its reason, so the gap shows up in the log.
        #
        # History behind the runner's "no per-suite rc tolerance" rule: the
        # resolve-var suite used to be carved out in THIS job, with its cases
        # (i)/(j) tolerated as a known pre-existing failure (#96). That
        # carve-out is gone -- #96 established that the ALLOW verdict comes
        # from wt_write_mktemp_same_command_safe(), a deliberate safety
        # feature that reached the vendored hook AFTER those assertions were
        # written, so the suite's own assertions were updated to match and it
        # now passes outright. Every suite is judged on its exit status alone
        # again; the only sanctioned skip is a whole-suite one, backed by a
        # tracked issue via the two manifests above (#185).
        run: |
          ./scripts/run-loom-suites.sh \
            --glob '.loom/hooks/tests/*.sh' \
            --manifest-prefix 'defaults/hooks/tests/' \
            --label '.loom/hooks/tests/*.sh' \
            --missing-manifest-note 'cannot tell which suites are daemon-backed' \
            --skip-note 'daemon-backed or consumer carve-out, see #185' \
            --empty-note 'every one is in a skip list'

  merge-pr-suites:
    name: Loom merge-pr.sh regression suites
    runs-on: ubuntu-latest
    # Regression protection for #126: nothing in CI ran .loom/scripts/tests/
    # at all, which is how resync commit 9118550 could revert both the #104
    # `|| true` fix in merge-pr.sh's _check_champion_hold_state_staleness()
    # AND its own T10 regression test in the same commit and still get a
    # fully green CI run (#124 / PR #125 restored the fix; this job is the
    # structural fix that stops it from being silently revertible again).
    #
    # Scoped deliberately narrow: only the `test-merge-pr-*.sh` suites, run
    # directly by globbing the directory -- NOT via run-ci-suites.sh and the
    # ci-wired.txt manifest, which references suites/paths (defaults/,
    # tests/install/, tests/hermit/) that don't exist in this consumer repo
    # and fails its own precondition check here. All test-merge-pr-*.sh
    # suites are present in this repo and already listed in ci-wired.txt
    # (see .loom/scripts/tests/ci-wired.txt lines ~143-164); wiring the rest
    # of that manifest is tracked separately.
    #
    # Daemon-backed suites are skipped via ci-excluded.txt (#156). Upstream
    # has ported many merge-pr.sh internals to `loom-daemon` subcommands, and
    # those suites source lib/require-daemon-bin.sh, which deliberately FAILS
    # (never skips) when no binary resolves. This runner has no Rust
    # toolchain and no loom-daemon, so it cannot run them; upstream runs them
    # in a separate "Native Port Suites" job that downloads a built binary.
    # Upstream's own manifest of those suites, with one reason per suite, is
    # .loom/scripts/tests/ci-excluded.txt -- it is what upstream's
    # run-ci-suites.sh job uses to leave them out, and each resync keeps it
    # current. The runner reads that file with the same parsing idiom as
    # check-ci-suite-manifest.sh, plus this repo's own supplement
    # .github/ci-suites-consumer-skips.txt for suites upstream's manifest
    # cannot express (#185, symptom #177), and prints every skipped suite
    # with its reason, so the gap shows up in the log. Nothing in
    # require-daemon-bin.sh is changed.
    steps:
      - uses: actions/checkout@v4

      - name: Run .loom/scripts/tests/test-merge-pr-*.sh suites
        # Same repo-owned runner as the guard-hooks job above
        # (scripts/run-loom-suites.sh, #338) -- one implementation of the
        # classification algorithm and of this repo's reading of the two skip
        # manifests, so a change to either contract is applied once rather
        # than replayed across two YAML heredocs.
        #
        # No --manifest-prefix here: these suites live in
        # .loom/scripts/tests/ itself, which is the directory upstream's
        # ci-excluded.txt names by bare basename.
        run: |
          ./scripts/run-loom-suites.sh \
            --glob '.loom/scripts/tests/test-merge-pr-*.sh' \
            --label 'test-merge-pr-*.sh' \
            --missing-manifest-note 'cannot tell which suites need a built loom-daemon' \
            --skip-note 'needs a built loom-daemon, or consumer carve-out per #185' \
            --empty-note 'every one is listed in .loom/scripts/tests/ci-excluded.txt'

  curator-idempotency-suites:
    name: Loom Curator heartbeat-idempotency regression suite
    runs-on: ubuntu-latest
    # Regression protection for #154: the Curator's re-check heartbeat spammed
    # issue #12 with 44 marker comments in a month (27 of 43 gaps under the 24h
    # idempotency window, minimum 23 minutes) because its prior-marker read was
    # a single unpaginated REST page -- the OLDEST 30 comments -- so the marker
    # it compared against was the thread's 30th comment, ~400h old, for weeks.
    # `dep-recheck-prior-marker.sh` is the fail-closed replacement and this job
    # is what stops a future `chore: resync installed Loom surfaces` commit from
    # reverting it silently (the same failure mode as #107 and #126, which the
    # guard-hooks and merge-pr-suites jobs above exist for).
    #
    # Scoped to the ONE hermetic suite: test-dep-recheck-prior-marker.sh drives
    # the reader through --stdin fixtures with no forge, no network and no
    # loom-daemon. Its companion test-dep-recheck-heartbeat-race.sh is
    # deliberately NOT here -- it drives the real `dep-recheck-fingerprint.sh
    # decide` stub, which needs a built loom-daemon this runner has no way to
    # obtain (it is listed in ci-excluded.txt for exactly that reason, and runs
    # on any fleet host, where the binary is present).
    steps:
      - uses: actions/checkout@v4

      - name: Run the prior-marker read suite
        run: |
          # See the "Deliberately NOT set -e" rationale in
          # scripts/run-loom-suites.sh -- same reasoning applies here (this
          # job is a deliberately scoped single-suite runner and does NOT
          # share that script, #338).
          set +e -u -o pipefail
          f=.loom/scripts/tests/test-dep-recheck-prior-marker.sh
          if [[ ! -f "$f" ]]; then
            echo "FAILED: $f is missing -- a resync removed the suite."
            exit 1
          fi
          bash "$f"
          rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "FAILED: $f (exit $rc)"
          fi
          exit "$rc"
